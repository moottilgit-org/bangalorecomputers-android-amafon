apply plugin: 'com.android.application'

android {
    signingConfigs {
        config {
            keyAlias 'bangalorecomputers.com'
            keyPassword 'dss123@IndiA'
            storeFile file('E:/Android/__ANDROID_BUNDLE/Licenses_Eclipse/atoz.keystore')
            storePassword 'dss123@IndiA'
        }
    }
    compileSdkVersion 28
    buildToolsVersion '28.0.3'
    defaultConfig {
        applicationId "com.atoz.johnnysapp.store"
        minSdkVersion 17
        targetSdkVersion 28
        versionCode 89
        versionName "1.89"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.config

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        debug {
            signingConfig signingConfigs.config
        }
    }
    dexOptions {
        jumboMode = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    productFlavors {
    }
//    useLibrary 'org.apache.http.legacy'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('src/main/lib/httpmime-4.1.jar')

    implementation "com.android.support:appcompat-v7:25.3.1"
    implementation 'com.android.support.constraint:constraint-layout:1.1.2'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'

    implementation "com.squareup.okhttp3:okhttp:3.12.1"
    implementation "com.tonyodev.fetch2:fetch2:2.3.6"
    implementation "com.tonyodev.fetch2okhttp:fetch2okhttp:2.3.6"
    implementation "com.google.android.gms:play-services-vision:17.0.2"
    //implementation "com.google.firebase:firebase-auth:$VERSION_FIREBASE"
    implementation "com.google.firebase:firebase-messaging:17.4.0"//17.3.4

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.picasso:picasso:2.5.2'

    implementation 'com.anees4ever:fastscroll:1.3.0'

    implementation 'com.android.support:multidex:1.0.3'
}

apply plugin: "com.google.gms.google-services"